title: "Look It Up, Don't Carry It: How Language Models Move Unwritten Information Across Their Own Text"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Language models often use information they have not written down, such as a planned rhyme, an intermediate result or a secret choice. Such information can reach the position that uses it by three paths: it can be written into the text and read back (emission), read directly from the position where it originates (retrieval), or carried forward through the positions of the text the model generates (relay). Relay is the path that would undermine chain-of-thought monitoring, because the information would travel through the model's own output without appearing in it. We introduce *route accounting*, which changes the information at its source by patching hidden states and measures how much of the resulting effect travels by each path. On induction, where relay is the known mechanism, it attributes the effect to relay. On four tasks across 15 checkpoints of Qwen3, Qwen3.5 and Gemma 3 (1B to 32B parameters), models instead retrieve. Rhyme plans are read from the rhyme word or from a copy stored at the line's final token; computed values are recomputed from their visible sources; written intermediate values are followed (83 to 99% of the effect). Relay along the generated line accounts for at most 1% of the effect outside its last three tokens. Three settings designed to force relay confirm the pattern. In a recurrent hybrid, the recurrent memory accounts for 2 to 4% of the effect. Beyond Gemma 3's local attention window, the model reads the stored line-end copy and relay reaches only 12%. A secret choice is stored at a few predictable prompt tokens, and the intervening sentence holds at most 7% of it. The stored line-end copy is the one path that grows with scale, and it is already present in base models. Unwritten information is kept at a few predictable positions of the context, not passed along the generated text.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - activation patching
  - chain-of-thought monitoring
