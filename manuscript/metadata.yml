title: "Language Models Retrieve Rather Than Relay Unwritten Information"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Language models write one word at a time, yet they plan ahead. When writing a rhyming couplet, a model picks the rhyme before it writes the line that must end with it. Where is that plan kept while the line is being written? It could be written into the text, looked up at a fixed earlier position such as the rhyme word itself, or relayed through the model's internal activity at each new word, its hidden states, without ever being written. Relay is the route that would hide reasoning from a monitor reading the text. We introduce route accounting, which edits hidden states where information originates and divides the resulting effect among these routes, and we validate it on induction, where an indirect route is known to dominate. Across 15 checkpoints of Qwen3, Qwen3.5 and Gemma 3, from 1B to 32B parameters, models look up the plan rather than relay it. The same holds for the intermediate results of a computation and for a secret choice, and it holds in settings built to favour relay, where the source lies beyond the attention window or recurrent layers could carry it. In every case relay stays small. With scale, models add a second lookup site, a copy of the plan stored at the end of the line, which reconciles conflicting published accounts of where rhyme plans live. In short generations with thinking disabled, unwritten information is kept at a few predictable places in the context, out of sight of a reader of the text but within reach of a monitor that probes hidden states.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - activation patching
