title: "The Output Is Part of the Circuit: Separating Latent Persistence from Generated-Token Relay"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  An autoregressive language model does not merely compute a hidden state and
  then reveal it through text: its own outputs become part of its future causal
  environment. This creates two distinct ways for an internal intervention to
  affect a later prediction. Information can persist through the model's hidden
  computation, or it can be externalized into a generated token and then
  re-enter the network as a high-leverage input. We develop an intervention
  framework that separates these routes and ask which one actually carries
  apparent "future-token control."

  In Gemma 3 270M, a sparse feature intervention that seems to coordinate an
  article with a future noun is overwhelmingly carried by the generated article
  rather than by strong persistent latent control. Replaying the treated article
  reproduces the later noun change, restoring the baseline article rescues the
  original noun, and the residual effect under a fixed article is small. Near the
  article decision boundary, a tiny additional change in intervention strength
  produces an approximately 0.94-TV jump in the noun distribution, while the
  fixed-article paths barely move. The large behavioral effect is therefore
  created at a latent-to-symbol handoff: the intervention changes a discrete
  public action whose downstream continuation branches already differ
  enormously.

  At the same time, the model is not limited to this public relay. Independent
  residual-state interventions at the pre-article position can bias later noun
  prediction toward specific targets even when the article itself is clamped,
  and analogous private influence is present at both 270M and 1B. These results
  suggest that causal influence in autoregressive models is distributed across a
  closed loop linking internal state, decoding policy, generated symbols, and
  later computation. We formalize this with a causal-validity ladder and a gain
  decomposition showing that downstream public effects depend jointly on local
  causal pressure, decoder susceptibility, and continuation-branch leverage. The
  resulting picture is not simply "features cause future tokens," but a more
  general account of where causal state resides and how it is transformed during
  generation.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - feature circuits
  - sparse autoencoders
