title: "Look It Up, Don't Carry It: How Language Models Move Unwritten Information Across Their Own Text"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Language models often use information they have not written down, such as a planned rhyme, an intermediate result or a secret choice. Such information can reach the position that uses it by three paths: it can be written into the text and read back (emission), read directly from the position where it originates (retrieval), or carried forward through the positions of the text the model generates (relay). Relay is the path that would undermine chain-of-thought monitoring, because the information would travel through the model's own output without appearing in it. We introduce *route accounting*, which changes the information at its source by patching hidden states and measures how much of the resulting effect travels by each path, alone and in interaction. We validate it on induction, a circuit that prior work shows passes information through an intermediate token: route accounting finds relay as the largest path there in all nine models tested, so it can detect relay when relay is used. On four tasks across 15 checkpoints of Qwen3, Qwen3.5 and Gemma 3 (1B to 32B parameters), with thinking disabled and short generated spans, models instead retrieve. Rhyme plans are read from the rhyme word or from a copy stored at the line's final token, and relay along the generated line accounts for at most 1% of the effect outside its last three tokens. Computed values are recomputed from their visible sources; when the model writes intermediate values, the answer follows them (83 to 99% of the effect). Three stress tests bound this pattern. In a recurrent hybrid, the recurrent memory accounts for 2 to 4% of the effect. Beyond Gemma 3's local attention window, the model relies on the stored line-end copy, and relay along the generated text reaches 12%, the one exception, between our committed stop and go thresholds. For a secret choice, pick-specific information is stored at a few predictable prompt tokens and read at the reveal; the intervening sentence never names it and relays at most 2% of its effect. The stored line-end copy is the one path that grows with scale, and it is already present in base models. In these settings, unwritten information is kept at a few predictable positions of the context rather than passed along the generated text.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - activation patching
  - chain-of-thought monitoring
