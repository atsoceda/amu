title: "The Output Is Part of the Circuit: Public and Private Causal Routes in Autoregressive Models"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Autoregressive generation closes a causal loop: a model's output becomes part
  of its next input. A future-relevant intervention can therefore act through
  two routes. Its influence may persist privately in contextual state, or be
  projected into a public token and re-enter the model through feedback. We
  introduce a six-cell intervention assay and a four-stage causal-validity
  ladder that distinguish these routes.

  In Gemma 3 270M, an attribution-selected sparse intervention that rewrites
  `a pilot` as `an aviator` is almost entirely public. Replaying the treated
  article reproduces the noun, restoring the baseline article rescues it, and
  token substitution accounts for 0.891 TV of a 0.893-TV total change, leaving
  0.028 TV under the fixed treated article. Near the article boundary, a gain
  change of at most 0.0039 produces a 0.938-TV noun jump while either
  fixed-article path moves only 0.014. Yet private target information is also
  causally effective: natural-state-derived residual patches alter later noun
  predictions while the article is fixed at both 270M and 1B.

  A neutral-prompt synonym assay at 1B reveals mediator-relative routing. When
  two correct alternatives require different articles, target-aligned influence
  is public-dominant (0.189 public versus 0.019 private); when both require `a`,
  it is private-dominant (approximately 0 public versus 0.093 private). Every one
  of 14 semantic families has the predicted route sign. Thus a generated token
  acts as a lossy public projection: distinctions it expresses can recruit a
  public relay, while distinctions it collapses remain causally available in
  private context in this controlled assay. Finally, public effect magnitude
  factorizes into mediator-policy movement and continuation leverage. Together,
  the results replace undifferentiated "future-token control" with an account of
  routing and gain in the autoregressive feedback circuit.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - feature circuits
  - sparse autoencoders
