title: "Look It Up, Don't Carry It: How Language Models Move Unwritten Information Across Their Own Text"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Language models often use information they have not written down, such as a planned rhyme, an intermediate result or a secret choice. It can reach the position that uses it by three paths: written into the text and read back (emission), read directly from where it originates (retrieval), or passed along the text the model generates (relay). Relay would undermine chain-of-thought monitoring, because the information would travel through the model's own output without appearing in it. We introduce *route accounting*, which edits hidden states at the source and measures how much of the effect travels by each path, alone and in interaction. On induction, where an indirect path through an intermediate token is the known mechanism, it finds that path as the largest in all nine models tested. On four tasks across 15 checkpoints of Qwen3, Qwen3.5 and Gemma 3 (1B to 32B parameters), with thinking disabled and short generated spans, models instead look information up. Rhyme plans are read from the rhyme word or from a copy stored at the line's final token, and relay along the generated line accounts for at most 1% of the effect. Patching every position after a computed value's source barely moves the answer, while written intermediate values account for 83 to 101% of the effect. Three stress tests bound this pattern. In a recurrent hybrid, a donor signal entering only through the recurrent layers produces 2 to 4% of the effect. Beyond the local attention window, the stored copy becomes necessary for about half of the effect, and the generated text accounts for 9 to 13%. A secret choice is stored at a few prompt tokens, and at most 2% of its effect passes through the intervening sentence. The stored copy is the one path that grows with scale. In these settings, unwritten information is kept at a few predictable positions of the context rather than relayed along the generated text.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - activation patching
  - chain-of-thought monitoring
