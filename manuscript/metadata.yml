title: "The Output Is Part of the Circuit: Separating Latent Persistence from Generated-Token Relay"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Once an autoregressive model writes a token, that token is an input to every
  later prediction. An internal intervention that changes an early token can
  therefore change a later token without leftover internal control of the later
  computation. We separate those routes with a six-cell design: the intervention
  off or on, crossed with free generation and with two inserted values of the
  early token. The free-generation change then splits exactly into a
  token-substitution piece and a matched-prefix leftover. On pretrained Gemma 3
  270M, inserting `a` versus `an` already moves occupation-noun distributions by
  total variation $0.937$. Amplifying an attribution-selected dual-effect sparse
  set (S1) at $5\times$ flips completions such as $a$ pilot $\to$ $an$ aviator
  on 19/20 prompts, but under greedy decoding treated-token replay phenocopies
  and baseline-token restoration rescues the corresponding top noun on 20/20;
  token substitution has cosine $0.95$ with the total while leftover TV is
  $0.028$. Aligning gain to each prompt's article boundary sharpens the
  mechanism: between two gains separated by at most $0.0039$ that bracket the
  article argmax, the free-path noun distribution jumps $0.938$ TV, whereas
  either fixed-article distribution moves $0.014$. Float32 final-head and
  stochastic-policy audits show that coarse native margins are bfloat16
  quantization while relay dominance survives finer readout and non-greedy
  article policies. Conversely, a target-cued
  full residual patched at the original pre-article position shifts
  target-minus-source logits by $1.339$ on 12 held-out same-article pairs
  despite a fixed visible token. In this task, visible token identity and
  contextual information propagated from the preceding position are separately
  intervenable causes of noun prediction; S1's large effect is overwhelmingly
  public-relayed, while a target-constructed residual patch establishes
  private-route capacity. Natural residual patches reproduce target-specific
  fixed-token influence without a greedy article switch. At Gemma 3 1B, the
  same sparse recipe is too weak; a development effect-matched coalition moves
  the binary article margin but usually makes a non-article token top-1, so its
  transmission channel is not identified. A matched natural-residual assay
  shows stronger target-logit movement at 1B without uniformly larger private
  TV or behavioral sufficiency. Independent 32-feature calibrations at both
  scales show that article attribution predicts local article efficacy but not
  the downstream public/private transmission phenotype.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - feature circuits
  - sparse autoencoders
