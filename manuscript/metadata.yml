title: "Look It Up, Don't Carry It: How Language Models Move Unwritten Information Across Their Own Text"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  A language model often uses information it has not written: a planned rhyme, an intermediate value, a private choice. That information can reach the position that uses it in three ways. It can be written into the text and read back (emission), read directly from where it originates (retrieval), or passed forward through the positions of the model's own generated text (relay). Relay matters most for monitoring, because the content stays in the model's state while the text in between says nothing about it. We introduce *route accounting*, a state-patching decomposition that measures each path's share of an effect, with sufficiency and necessity versions and an explicit interaction term. We validate it on induction, where relay is the known mechanism. Across 15 checkpoints from three families (Qwen3, Qwen3.5 and Gemma 3; 1B to 32B parameters; chat and plain prompts; instruct and base models), a single principle holds: models look information up rather than carry it. Rhyme plans are read from the rhyme word, or from a copy stored at the line's final token. Computed values are recomputed from their visible sources. Written reasoning is followed, carrying 83 to 99% of the effect. Relay along generated text beyond the last few positions stays at or below 1%. We then test the principle where it should fail. In a recurrent hybrid, the recurrent memory carries 2 to 4% of the plan. When the source falls outside Gemma 3's local attention window, the model relies on the stored line-end copy for about half the effect, and generated-text relay reaches only about 12%; a smaller model without such a copy loses the plan altogether. A choice that a reader cannot infer from the text is stored at a predictable function word in the prompt and read at the reveal; it is neither relayed through nor written into the intervening sentence. The one route that grows with scale is storage at the line's final token, which is already present in base checkpoints. For monitoring, the results locate where unwritten information is kept: at a small set of structural positions, not along the generated text.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - activation patching
  - chain-of-thought monitoring
