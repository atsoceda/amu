title: "Packaging without Independent Content Control: Causal Edge Tests of Latent Planning Features in Gemma~3 270M"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Sparse feature interventions that flip grammatical articles ($a$/$an$)
  are often read as evidence of modular latent planning: an internal
  content representation that both licenses the article and determines the
  upcoming noun. We show that, on pretrained Gemma~3 270M with Gemma Scope~2
  cross-layer transcoders, this reading is fragile. Features that move
  articles under free generation typically switch coordinated
  article--noun packages (e.g., $a$ pilot $\to$ $an$ aviator)
  rather than preserving content. Holding the article fixed restores the
  native noun, revealing a strong $b\to c$ confound. Under a
  corrected protocol that keeps content interventions active while the
  article is pasted at its native value, we obtain a consistent null for
  independent within-class content rewrite across recurring content-ish
  features, Latent-Planning-style per-noun attribution features, and a
  dense residual (MLP-in) direction. The novelty is the juxtaposition:
  packaging is easy to edit; independent $C\to c$ is not, in
  every representation we could manipulate. We argue that article-only
  metrics systematically overstate modular planning on this model and task.
keywords:
  - mechanistic interpretability
  - latent planning
  - feature circuits
  - sparse autoencoders
  - causal interventions
