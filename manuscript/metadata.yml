title: "The Output Is Part of the Circuit: Separating Latent Persistence from Generated-Token Relay"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Once an autoregressive model writes a token, that token is an input to every
  later prediction. An internal intervention that changes an early token can
  therefore change a later token without any leftover internal control of the
  later computation. We separate those routes with a six-cell design: the
  intervention off or on, crossed with free generation and with two inserted
  values of the early token. The free-generation change in the later-token
  distribution then splits exactly into a token-substitution piece and a
  matched-prefix leftover. On pretrained Gemma 3 270M, inserting `a` versus
  `an` with the intervention off already moves occupation-noun distributions
  by total variation $0.937$ on 20 held-out prompts. Amplifying a dual-effect
  sparse set (S1) at $5\times$ flips free completions such as $a$ pilot
  $\to$ $an$ aviator on 19/20 prompts, but inserting the intervention-chosen
  article with the intervention off reproduces the new top-1 noun on 20/20
  prompts; the token-substitution vector has cosine $0.95$ with the total
  change, while the leftover has total variation $0.028$. The same leftover
  under inserted `an` is already present at $1.5\times$, when free generation
  almost never flips the article. Attribution-selected ``content'' features
  (S3) do not move nouns. The result is a transmission measurement, not a
  verdict on whether a latent plan exists: generated-token controls are
  required before later-token change can be read as persistent internal
  control.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - feature circuits
  - sparse autoencoders
