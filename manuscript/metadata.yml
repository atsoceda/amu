title: "Look It Up, Don't Carry It: How Language Models Move Unwritten Information Across Their Own Text"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Language models often use information they have not written down, such as a planned rhyme, an intermediate result or a secret choice. It can reach the position that uses it in three ways: written into the text and read back (emission), looked up at a fixed position of the context, such as where it originates (lookup), or passed forward in the hidden states of the text the model generates, without being written (relay). Relay would undermine chain-of-thought monitoring, because a monitor reading the generated text would not see the information. We introduce *route accounting*, which edits hidden states at the source and measures how much of the effect travels by each path. On induction, where information is known to reach its target through the hidden state of an intermediate position, it finds that path as the largest in all nine models tested. On four tasks across 15 checkpoints of Qwen3, Qwen3.5 and Gemma 3 (1B to 32B parameters), with thinking disabled and short generated spans, models instead look up information. Rhyme plans are read from the rhyme word or from a copy stored at the line's final token, and relay accounts for at most 1% of the effect. Patching every position after a computed value's source barely moves the answer, while written values account for at least 83% of the effect. Three stress tests bound this pattern: entry through the recurrent layers of a hybrid produces 2 to 4% of the effect; beyond the attention window the model hands the plan to the stored copy, which becomes necessary for about half of it, and the generated text accounts for 9 to 13%; and at most 2% of a secret choice's effect passes through the hidden states of the intervening sentence. The stored copy is the one path that grows with scale. In these settings, unwritten information is kept at a few predictable positions of the context rather than relayed through the hidden states of the generated text.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - activation patching
  - chain-of-thought monitoring
