title: "Look It Up, Don't Carry It: How Language Models Move Unwritten Information Across Their Own Text"
author:
  - name: Anonymous Authors
    affiliations:
      - name: Anonymous Institution
abstract: |
  Language models often use information they have not written down, such as a planned rhyme, an intermediate result or a secret choice. Such information can reach the position that uses it by three paths: it can be written into the text and read back (emission), read directly from the position where it originates (retrieval), or passed along the text the model generates (relay). Relay is the path that would undermine chain-of-thought monitoring, because the information would travel through the model's own output without appearing in it. We introduce *route accounting*, which changes the information at its source by patching hidden states and measures how much of the resulting effect travels by each path, alone and in interaction. We validate it on induction, a circuit that prior work shows passes information through an intermediate token: route accounting finds that indirect path as the largest path in all nine models tested, so it can detect information that arrives through intermediate positions. On four tasks across 15 checkpoints of Qwen3, Qwen3.5 and Gemma 3 (1B to 32B parameters), with thinking disabled and short generated spans, models instead retrieve. Rhyme plans are read from the rhyme word or from a copy stored at the line's final token, and relay accounts for at most 1% of the effect beyond the three tokens just before the rhyme. For computed values, patching every position after the source has little effect while source edits remain effective; when the model writes intermediate values, the answer follows them (83 to 101% of the effect, the 101% being a slightly negative bypass). Three stress tests bound this pattern. In a recurrent hybrid, a donor signal entering only through the recurrent layers produces 2 to 4% of the effect. As filler moves the source beyond Gemma 3's local attention window, the stored copy becomes more necessary, while the generated text, including the three tokens just before the rhyme, accounts for 9 to 13% at nonzero distances; how much of that is relay remains unresolved. For a secret choice, pick-specific information is stored at a few predictable prompt tokens and read at the reveal; the intervening sentence never names it and passes on at most 2% of the text-swap effect. The stored copy is the one path that grows with scale, and it is already present in base models. In these settings, unwritten information is kept at a few predictable positions of the context rather than relayed along the generated text.
keywords:
  - mechanistic interpretability
  - latent planning
  - causal mediation
  - activation patching
  - chain-of-thought monitoring
